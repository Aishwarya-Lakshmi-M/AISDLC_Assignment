[project]
name = "reminder-agent"
version = "0.1.0"
description = "A small Python application that converts natural-language reminders into validated structured JSON."
requires-python = ">=3.11"
dependencies = [
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
gemini = [
  "google-genai",
]
demo = [
  "streamlit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
